name: CI

on:
  push:
    branches: ["main", "develop", "diego"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # El contexto `secrets` no se puede usar dentro de un `if:` (restricción
    # de GitHub Actions, no un typo); por eso se refleja primero en env a
    # nivel de job y el `if:` del paso de Sonar compara `env.SONAR_TOKEN`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: mvn verify (incluye ArchitectureRulesTest y SalaTest)
        run: mvn -B verify

      # Escaneo de mantenibilidad (duplicación, code smells, cobertura). No
      # falla el build si el secret no está configurado: falta crear el
      # proyecto en SonarCloud y guardar SONAR_TOKEN (y opcionalmente
      # SONAR_ORGANIZATION / SONAR_PROJECT_KEY) como secret del repo — eso
      # es un paso manual en sonarcloud.io + GitHub, no algo que el código
      # pueda hacer por sí mismo. Ver PENDIENTES_SPRINT2.md, punto 3.
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'planazo-game' }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
