spring:
  application:
    name: minijuego-service

  datasource:
    url: jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5433}}/${PGDATABASE:${DB_NAME:minijuego}}
    username: ${PGUSER:${DB_USER:minijuego}}
    password: ${PGPASSWORD:${DB_PASSWORD:minijuego}}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway es la única fuente de verdad del esquema, nunca Hibernate.
    open-in-view: false
    properties:
      hibernate:
        default_schema: minijuego
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: minijuego

  data:
    redis:
      host: ${REDISHOST:${REDIS_HOST:localhost}}
      port: ${REDISPORT:${REDIS_PORT:6380}}
      password: ${REDISPASSWORD:${REDIS_PASSWORD:}}
      database: 1


  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework

planazo:
  seguridad:
    jwt:
      # SOLO para desarrollo local. En cualquier otro ambiente se sobrescribe
      # con la variable de entorno JWT_SECRETO (ver .env.example) y debe ser
      # EXACTAMENTE el mismo secreto que usa el microservicio de Registro y
      # autenticación para firmar sus JWT reales — de eso depende que este
      # servicio pueda validar tokens emitidos por el otro.
      secreto: ${JWT_SECRETO:cambia-este-secreto-de-desarrollo-minijuego-planazo-32b}
      expiracion-minutos-dev-token: 120
    dev-token:
      # POST /api/v1/auth/dev-token emite tokens sin contraseña: solo para probar en local.
      habilitado: ${DEV_TOKEN_HABILITADO:false}
  cors:
    # Orígenes del frontend que pueden llamar a la API y al WebSocket (separados por coma).
    origenes: ${CORS_ORIGINS:http://localhost:3000,https://planazo-frontend.vercel.app,https://planazo-frontend-*.vercel.app}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      service: game
      instance: ${RAILWAY_REPLICA_ID:${HOSTNAME:local}}
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.planazo.minijuego: INFO
